<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>翠光 管理 — SUIGO Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='72' font-size='48' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='900'>管</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/admin.css" />
</head>
<body>
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <p class="login-eyebrow">SUIGO Admin</p>
      <h1>管理画面</h1>
      <p class="login-desc">パスワードを入力してログインしてください。</p>
      <label class="field">
        <span>パスワード</span>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p class="login-error" id="login-error" hidden>パスワードが正しくありません</p>
      <button type="submit" class="btn btn--primary">ログイン</button>
      <a href="/" class="login-back">← サイトに戻る</a>
    </form>
  </div>

  <div id="admin-app" class="admin-app" hidden>
    <header class="admin-header">
      <div class="admin-header-left">
        <a href="/" class="admin-logo">SUIGO</a>
        <span class="admin-badge">Admin</span>
      </div>
      <div class="admin-header-actions">
        <button type="button" class="btn btn--ghost" id="btn-preview">プレビュー</button>
        <button type="button" class="btn btn--ghost" id="btn-export">JSON出力</button>
        <label class="btn btn--ghost btn-file">
          JSON読込
          <input type="file" id="btn-import" accept=".json" hidden />
        </label>
        <button type="button" class="btn btn--primary" id="btn-save">保存</button>
        <button type="button" class="btn btn--ghost" id="btn-logout">ログアウト</button>
      </div>
    </header>

    <div class="admin-layout">
      <nav class="admin-nav" id="admin-nav">
        <button type="button" data-panel="meta" class="active">基本設定</button>
        <button type="button" data-panel="hero">ヒーロー</button>
        <button type="button" data-panel="about">About</button>
        <button type="button" data-panel="works">Works</button>
        <button type="button" data-panel="process">Process</button>
        <button type="button" data-panel="services">Services</button>
        <button type="button" data-panel="team">Team</button>
        <button type="button" data-panel="voices">Voices</button>
        <button type="button" data-panel="journal">Journal</button>
        <button type="button" data-panel="faq">FAQ</button>
        <button type="button" data-panel="cta">CTA</button>
        <button type="button" data-panel="contact">Contact</button>
        <button type="button" data-panel="settings">設定</button>
      </nav>

      <main class="admin-main" id="admin-main"></main>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
